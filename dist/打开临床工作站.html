<title>临床工作站 · 资料查阅</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="app.css">
<script defer src="chunks.js"></script><script defer src="db.js"></script><script defer src="search-core.js"></script><script defer src="portable.js"></script><script defer src="app.js"></script>

<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="shell">
<aside class="sidebar">
<a class="brand" href="#home"><span class="brand-mark" aria-hidden="true">+</span><span>临床工作站<small>临床资料 · 本地查阅</small></span></a>
<p class="nav-label">资料目录</p>
<nav id="nav" aria-label="模块导航"></nav>
<div class="sidebar-bottom"><button class="nav-item" id="settingsBtn"><span aria-hidden="true">⚙</span>离线与设置</button><p id="lockHint">其余资料已锁定</p><button class="outline" id="lockBtn">解锁资料</button><small>资料版本 · 2026年11月11日</small></div>
</aside>
<div class="workspace">
<header class="topbar"><button id="menuBtn" class="mobile-only icon-btn" aria-label="展开资料目录" aria-expanded="false">☰</button><span id="breadcrumb">工作台</span><div class="top-actions"><span id="network" class="connection">正在检查连接</span><button id="topLock" class="text-btn">解锁资料</button></div></header>
<main id="main" tabindex="-1">
<div class="search-wrap"><form id="searchForm" role="search"><label class="sr-only" for="searchInput">搜索临床资料</label><span class="search-icon" aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="搜索急救名称、症状或处置内容" maxlength="200" autocomplete="off"><button type="submit">搜索资料</button></form><p id="searchHint">当前免密码搜索急救资料 · 支持名称、拼音和首字母</p></div>
<div id="view"></div>
</main>
<footer>临床工作站 <span>资料保留原文，缺失与待核对状态随记录呈现。</span></footer>
</div></div>
<dialog id="lockDialog" aria-labelledby="lockTitle"><form id="unlockForm"><button type="button" class="dialog-close" aria-label="关闭解锁窗口">×</button><span class="dialog-symbol" aria-hidden="true">⌑</span><h2 id="lockTitle">解锁临床资料</h2><p>临床医嘱、药品、病历模板与医疗文书需解锁后查阅。急救始终可以直接使用。</p><label for="password">本地访问密码</label><input id="password" type="password" autocomplete="current-password" required><p id="passwordError" role="alert" class="error"></p><button class="primary" type="submit">解锁资料</button><small>仅锁定本地界面，资料未进行加密。</small></form></dialog>
<dialog id="reader" aria-labelledby="readerTitle"><header class="reader-bar"><button id="closeReader" class="outline">返回目录</button><div><button id="copyBtn" class="outline">复制内容</button><button id="printBtn" class="primary">打印当前内容</button></div></header><div class="reader-heading"><p id="readerCategory"></p><h2 id="readerTitle"></h2><p id="readerSource"></p></div><label id="templateSelectLabel" hidden>选择文书或段落<select id="templateSelect"></select></label><div id="readerFlags"></div><div id="readerBody"></div><div id="manualCopy" hidden><label for="copyText">复制受限，请选择下方文本手动复制</label><textarea id="copyText" readonly></textarea></div></dialog>
<div id="notice" role="status" aria-live="polite"></div>
<noscript>请启用浏览器脚本后使用临床工作站。原始文件可在交付包中单独查阅。</noscript>
</body></html>
